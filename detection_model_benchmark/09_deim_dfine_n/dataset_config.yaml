# Data-only config; training hyperparameters remain controlled by the composed model config.
task: detection
evaluator:
  type: CocoEvaluator
  iou_types: [bbox]
num_classes: 2
remap_mscoco_category: false
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/admin1/Projects/ultralytics-main/datasets/fruitfly_detection_v1/coco/train
    ann_file: /home/admin1/Projects/ultralytics-main/datasets/fruitfly_detection_v1/coco/annotations/instances_train.json
    return_masks: false
    transforms:
      type: Compose
      ops: null
  shuffle: true
  num_workers: 8
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /home/admin1/Projects/ultralytics-main/datasets/fruitfly_detection_v1/coco/val
    ann_file: /home/admin1/Projects/ultralytics-main/datasets/fruitfly_detection_v1/coco/annotations/instances_val.json
    return_masks: false
    transforms:
      type: Compose
      ops: null
  shuffle: false
  num_workers: 8
  drop_last: false
  collate_fn:
    type: BatchImageCollateFunction
